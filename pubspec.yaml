name: food_user_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  crypto: ^3.0.3

  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0


  # ── State Management ──────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1        # BLoC + Cubit
  equatable: ^2.1.0           # value equality for bloc states/events

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.3.0              # service locator

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^15.1.3          # declarative routing + guards

  # ── Networking ────────────────────────────────────────────────────────────
  flutter_dotenv: ^5.1.0

  dio: ^5.10.0               # HTTP client
  http: ^1.6.0                # Google Maps web service calls
  connectivity_plus: ^6.1.5   # network connectivity check

  # ── Functional Programming ────────────────────────────────────────────────
  dartz: ^0.10.1              # Either / Option for use-cases

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5  # lightweight key-value store
  flutter_secure_storage: ^9.2.4  # secure token storage

  # ── Maps ──────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.17.1  # Google Maps (MapPickerScreen)
  geolocator: ^14.0.2           # device location

  # ── Images ────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1  # image caching
  image_picker: ^1.2.3          # avatar upload

  # ── UI Utilities ──────────────────────────────────────────────────────────
  flutter_svg: ^2.3.0          # SVG assets
  shimmer: ^3.0.0               # skeleton loading
  smooth_page_indicator: ^1.2.1 # onboarding dots
  pin_code_fields: ^8.0.1       # OTP 6-digit input
  lottie: ^3.4.0                # animated splash / success

  # ── Permissions ───────────────────────────────────────────────────────────
  permission_handler: ^11.4.0

  # ── Firebase / Push Notifications ─────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0

  # ── Misc ──────────────────────────────────────────────────────────────────
  intl: ^0.20.2                 # date / currency formatting
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.1.5
  flutter_widget_from_html: ^0.15.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0            # BLoC unit testing helpers
  mocktail: ^1.0.5              # mocking without code-gen
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  uses-material-design: true

  assets:
    - .env

    - assets/images/
    - assets/images/home/
    - assets/images/service_listing/
    - assets/images/service_listing/2.0x/
    - assets/images/service_listing/3.0x/
    - assets/images/icons/main/
    - assets/images/icons/settings/
    - assets/images/icons/general_settings/
    - assets/images/icons/notifications/
    - assets/images/cart/
    - assets/images/icons/cart/
    - assets/images/products/
    - assets/images/icons/products/
    - assets/images/orders/
    - assets/images/icons/orders/
    - assets/images/favorites/
    - assets/images/icons/favorites/
    - assets/images/restaurant/
    - assets/images/restaurant/2.0x/
    - assets/images/restaurant/3.0x/
    - assets/icons/restaurant/
    - assets/icons/restaurant/2.0x/
    - assets/icons/restaurant/3.0x/
    - assets/images/address/
    - assets/images/icons/address/
    - assets/images/icons/profile/
    - assets/images/payment/
    - assets/images/icons/payment/
    - assets/images/support/
    - assets/images/icons/support/
    - assets/images/onboarding_collage/
    - assets/images/onboarding_collage/2.0x/
    - assets/images/onboarding_collage/3.0x/
    - assets/images/onboarding_collage-dark/
    - assets/images/onboarding_collage-dark/2.0x/
    - assets/images/onboarding_collage-dark/3.0x/
    - assets/images/search/
    - assets/images/categories/
    - assets/images/store/

  fonts:
    - family: ExpoArabic
      fonts:
        - asset: assets/fonts/ExpoArabic-Book.ttf
          weight: 400

        - asset: assets/fonts/ExpoArabic-Medium.ttf
          weight: 500

        - asset: assets/fonts/ExpoArabic-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
